<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Set the theme class before first paint to avoid a white flash.
      // Keep the key and logic in sync with src/utils/theme.ts.
      var saved;
      var dark;
      try {
        saved = window.localStorage.getItem("attendance_theme");
        dark =
          saved === "dark" ||
          (saved !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch {}
    </script>
    <title>KIET Attendance - CyberVidya</title>
    <link
      rel="icon"
      type="image/ico"
      href="https://globaleducation.s3.ap-south-1.amazonaws.com/cyber-vidya/images/favicon.ico"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
